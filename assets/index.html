<!DOCTYPE html>
<html data-theme="auto">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none';">
  <title>One-Time Password (OTP) generate</title>
  <!-- Link to Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tailwind-config.js"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 flex justify-center items-center h-screen flex-col">
  <h1 class="text-2xl font-semibold text-center mb-4 text-gray-900 dark:text-white">One-Time Password (OTP) generate</h1>

  <button id="toggleThemeBtn" class="absolute top-0 right-0 m-4 p-2 bg-gray-200 dark:bg-gray-600 rounded-lg">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-palette-fill text-gray-800 dark:text-white" viewBox="0 0 16 16">
      <path d="M12.433 10.07C14.133 10.585 16 11.15 16 8a8 8 0 1 0-8 8c1.996 0 1.826-1.504 1.649-3.08-.124-1.101-.252-2.237.351-2.92.465-.527 1.42-.237 2.433.07M8 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m4.5 3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3M5 6.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m.5 6.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
    </svg>
  </button>

  <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg w-1/2 lg:w-1/3">
    <div class="mx-auto mb-6 max-w-64 text-center">
      <img src="/favicon.png" alt="Logo" class="mx-auto lg:w-full w-4/5">
    </div>
    <form id="form">
      <div class="mb-4">
        <label for="inputField" class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">
          Enter your secret key
        </label>
        <div class="relative">
          <input id="inputField" type="password" name="inputField"
            class="mt-1 p-2 pr-10 w-full border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white dark:border-gray-600"
            placeholder="Enter your secret key" required autocomplete="off">
          <button id="toggleSecretBtn" type="button" title="Toggle visibility"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
            <!-- eye icon: visible when input is type="password" -->
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
              <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
            </svg>
            <!-- eye-slash icon: visible when input is type="text" -->
            <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="hidden">
              <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755l.19.196zM11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"/>
              <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="mb-4">
        <button id="submitBtn" type="submit"
          class="w-full py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 dark:bg-blue-700 dark:hover:bg-blue-600">Generate code</button>
      </div>
    </form>

    <div id="timerContainer" class="hidden mb-2">
      <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
        <span class="whitespace-nowrap">Refreshes in <span id="timerCount">30</span>s</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-1.5">
          <div id="timerBar" class="bg-blue-500 h-1.5 rounded-full" style="width:100%"></div>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <label id="resultLabel" aria-live="polite" class="block text-lime-600 dark:text-lime-400"></label>
      <button id="copyBtn" type="button" title="Copy OTP"
        class="hidden text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1 rounded">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/>
          <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"/>
        </svg>
      </button>
    </div>
  </div>

  <p class="text-center text-gray-500 mt-4 dark:text-gray-400">
    Made with ❤️ by <a href="https://workers.cloudflare.com/" target="_blank" class="text-blue-500 underline dark:text-blue-400">Cloudflare Workers</a>
  </p>
  <p class="text-center text-gray-500 mt-4 dark:text-gray-400">
    Please refer to: <a href="https://otplib.yeojz.dev" target="_blank" class="text-orange-500 underline dark:text-orange-400">https://otplib.yeojz.dev</a> for more information
  </p>

  <script src="https://unpkg.com/@otplib/preset-browser@12.0.1/buffer.js"></script>
  <script src="https://unpkg.com/@otplib/preset-browser@12.0.1/index.js"></script>
  <script src="/app.js"></script>

</body>

</html>
